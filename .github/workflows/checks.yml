# The automatic checks GitHub runs on every change (free for public repositories).
name: Checks

on:
  push:
    branches: [main, qa-platform-q-smart-v2-code-restructure]
  pull_request:

permissions:
  contents: read

jobs:
  v2:
    name: v2 (types, code checks, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  current-app:
    name: Today's app (its own tests)
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Sofia
    defaults:
      run:
        working-directory: current-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current-app/package-lock.json
      - run: npm ci
      - run: npm test
