# The automatic checks GitHub runs on every change (free for public repositories).
name: Checks

on:
  push:
    branches: [main, qa-platform-q-smart-v2-code-restructure]
  pull_request:

permissions:
  contents: read

# a newer change stops the checks of an older one that are still running
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2:
    name: v2 (types, code checks, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  current-app:
    name: Today's app (its own tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Sofia
    defaults:
      run:
        working-directory: current-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current-app/package-lock.json
      - run: npm ci
      # the same tests as `npm test`, but a test that hangs stops after 2 minutes and shows its name, and once every
      # result is in the run ends, even if a test forgot to stop a server it started (that used to keep the job waiting
      # until GitHub cancelled it)
      - run: node --test --test-force-exit --test-timeout=120000 --test-reporter=spec "test/*.test.js"
